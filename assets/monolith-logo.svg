    - A.I. Acknowledgement: Anthropic - Claude Fable 5.1; Anthropic - Claude Opus 5.5
    - Signature: ︻デ═─── ✦ ✦ ✦ | Aim Twice, Shoot Once!

✒ Changelog:
    - 1.0.1 (10/26/2026) [dendogg + Anthropic - Claude Opus 5.5] — Dennis
      asked for the logo in the web app's header: the page's app bar carries
      it now, written in by tools/build-emblem.mjs, so its path and its
      board-logo group stay put.
    - 1.0.0 (10/26/2026) [dendogg + Anthropic - Claude Opus 5.5] — Dennis
      made the 4 x 4 Conical M the official logo; first build, from the
      system.

✒ Description:
    MONOLITH's official logo, chosen by Dennis on 10/26/2026: the Conical M
    cut into a four by four grid of slate tiles with black mortar, no pieces.
    The letter is his (measured from conical-monolith-brand-kit.svg and
    written down in assets/brand/CONICAL_MONOLITH_SYSTEM.md); this file is the
    system's rendering of it at 1200 px, and the emblem is the same mark with
    his twelve pieces standing on it. It is the source of the page's app bar
    logo: tools/build-emblem.mjs writes it into index.html, reading its
    board-logo group.

✒ Key Features:
    - Canvas 1200 x 1200; the Conical M edge to edge on a 4 x 4 grid of 300
      px cells: 4 whole tiles, 8 cut to the outline
    - Tiles: slate #6f8a91, mortar #000000 stroked over the fill at 1 px per
      1200 (paint-order markers fill stroke), as Dennis draws the grout
    - One flat layer: groups only, no Inkscape layers
    - Regenerate by running assets/generator/conical_m.py; its official
      target rebuilds just the two marks

✒ Id Convention:
    component-subcomponent-panel, the panel suffix last: board-<panel> holds
    board-row-NN-<panel>, and each row its tiles, square-rNN-cNN-<panel>
    counted from the top left, -cut before the suffix for a tile the outline
    crosses, plinth-rNN-cNN-<panel> for a merged block under a piece;
    pieces-<panel> holds pieces-white-<panel> and pieces-black-<panel>, and
    they hold piece-<side>-<kind>[-NN]-<panel>, each its -contour- and -face-
    path. Sides are named by their faces: White is boxwood-faced. A
    construction panel holds outline-<panel> and grid-<panel> with its
    verticals and horizontals.

✒ Other Important Information:
    - Dependencies: none; opens in Inkscape 1.4 and renders in any browser
    - Official: the 4 x 4 Conical M is the MONOLITH mark; every mock-up
      under assets/mockups is built on this file's geometry
    - Source of truth: assets/generator/conical_m.py emits this file; edit
      the script or its parameters, not the SVG, then rerun it
    - XML note: an SVG header cannot carry the standard's closing dash rule,
      because a double hyphen is illegal inside an XML comment
-->

