✒ Metadata
    - Title: MONOLITH Logo (MONOLITH Edition - v1.0)
    - File Name: monolith-logo.svg
    - Relative Path: assets/monolith-logo.svg
    - Artifact Type: illustration
    - Version: 1.0.1
