<!--
✒ Metadata
    - Title: digiSpace Template — Default (1000 px square)
    - File Name: default.svg
    - Relative Path: default.svg
    - Artifact Type: template
    - Version: 1.0.0
    - Date: 2026-05-28
    - Update: Thursday, May 28, 2026
    - Author: Dennis 'dendogg' Smaltz
    - A.I. Acknowledgement: Anthropic - Claude Opus 4.7
    - Signature: ︻デ═─── ✦ ✦ ✦ | Aim Twice, Shoot Once!

✒ Description:
    Clean 1000×1000 px starting canvas with a 1:1 viewBox so every
    Inkscape extension, import, and "px" measurement behaves
    predictably. Used by File → New (default) AND listed under
    File → New From Template.

✒ Why this exists:
    Replaces an earlier `default.svg` that had a 1,000,000,000-unit
    viewBox left over from a Save-as-Template of a Firewatch logo
    design. That made 1 px = 1,000,000 user units, so anything imported
    or generated by an extension at sane px sizes collapsed to
    sub-pixel territory. This template makes 1 px = 1 user unit.
-->

