✒ Description:
    The MONOLITH M on a 8 by 8 grid of 150 px cells in the slate skin, the
    construction template: the outline with the full grid over it as invisible
    guide lines. Built by assets/generator/monolith_m.py from the letter's
    parameters; the system is described in assets/brand/MONOLITH_M_SYSTEM.md.

✒ Key Features:
    - Canvas 1200 x 1200; grid 8 x 8; cell 150 px
    - Outline: legs S/4, corners r 26.24, valley floor 146.43 deep and
      185.39 wide with cubic flanks (handles 59.35 and 72.39), crossbar
      underside at 509.68, notch to 600 (1200 units, scaled)
    - Skin slate: tiles #6f8a91 and #6f8a91, mortar #000000
    - Grid: 9 guide lines each way, the frame's edges included, laid over
      the outline; no fill, no stroke, no width

✒ Id Convention:
    component-subcomponent-panel, the panel suffix last: board-<panel> holds
    board-row-NN-<panel>, and each row its tiles, square-rNN-cNN-<panel>
    counted from the top left, -cut before the suffix for a tile the outline
    crosses, plinth-rNN-cNN-<panel> for a merged block under a piece;
    pieces-<panel> holds pieces-white-<panel> and pieces-black-<panel>, and
    they hold piece-<side>-<kind>[-NN]-<panel>, each its -contour- and -face-
    path. Sides are named by their faces: White is boxwood-faced. A
    construction panel holds outline-<panel> and grid-<panel> with its
    verticals and horizontals. The grid's lines are invisible guide paths (no
    fill, no stroke, no width): a template to snap to, not drawing, so they
    paint nothing and the grid's bounding box is the square itself.

✒ Other Important Information:
    - Dependencies: none; opens in Inkscape 1.4 and renders in any browser
    - Source of truth: assets/generator/monolith_m.py emits this file; edit
      the script or its parameters, not the SVG, then rerun it
    - XML note: an SVG header cannot carry the standard's closing dash rule,
      because a double hyphen is illegal inside an XML comment
